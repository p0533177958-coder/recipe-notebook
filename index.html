<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF6EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F1A17" />
    <meta name="description" content="מחברת מתכונים אישית עם מצב בישול שלב-אחר-שלב" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>מחברת מתכונים</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('rn-settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
